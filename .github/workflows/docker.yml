name: Publish Docker image
on:
  push:
    branches: [main]
    paths: [.github/workflows/docker.yml]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  packages: write
concurrency:
  group: ghcr-frp-otp
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Select released source
        id: meta
        run: |
          version="$(cat VERSION)"
          printf '%s\n' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          source="$(git rev-parse "$version^{commit}")"
          git worktree add --detach release-source "$source"
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf 'version=%s\nsource=%s\ncreated=%s\nimage=%s\n' \
            "$version" "$source" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$image" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish
        uses: docker/build-push-action@v7.4.0
        with:
          context: release-source
          file: ${{ github.workspace }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.meta.outputs.source }}
            CREATED=${{ steps.meta.outputs.created }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.source }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          docker run --rm "$IMAGE:$VERSION" -v | grep -F "frp-otp $VERSION "
